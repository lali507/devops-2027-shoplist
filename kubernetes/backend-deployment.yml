# backend-deployment.yml - the image we built, with passwords from the Secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shoplist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: shoplist-backend:local
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB      # which Secret key holds the database name?
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER    # which Secret key holds the user name?
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD # which Secret key holds the password?
          ports:
            - containerPort: 5000   # Flask port
          readinessProbe:
            httpGet:
              path: /health            # the endpoint that answers "I am ready"
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health            # same endpoint, but failure here restarts the container
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
