apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: greeter # שם מזהה של הפוד
  template:
    metadata:
      labels:
        app: greeter # שם התווית של הפוד
    spec:
      containers:
        - name: greeter
          image: greeter:v1
          imagePullPolicy: Never
          env:
            - name: GREETING
              value: "Hello"
          ports:
            - containerPort: 8000